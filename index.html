<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبارات الإدارة الصحية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow study column; home = course list, quiz = one question card, result = score + review */
:root{
  --bg:#eef3f2; --surface:#ffffff; --line:#d5e1df; --ink:#123b3c; --muted:#5b7473;
  --accent:#0d7a72; --accent-soft:#dff0ed; --good:#2f7d3a; --good-soft:#e5f2e4;
  --bad:#b23a4a; --bad-soft:#fbe7ea; --warn:#9a6a10; --warn-soft:#fbf0d9;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1a1a; --surface:#142625; --line:#264140; --ink:#e3efed; --muted:#93acaa;
  --accent:#4cc2b5; --accent-soft:#18383a; --good:#7cc98a; --good-soft:#173322;
  --bad:#f08a98; --bad-soft:#3a1d23; --warn:#e7bd62; --warn-soft:#3a2f17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1a1a; --surface:#142625; --line:#264140; --ink:#e3efed; --muted:#93acaa;
  --accent:#4cc2b5; --accent-soft:#18383a; --good:#7cc98a; --good-soft:#173322;
  --bad:#f08a98; --bad-soft:#3a1d23; --warn:#e7bd62; --warn-soft:#3a2f17; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;direction:rtl}
.wrap{max-width:680px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.35}
h1{font-size:1.65rem;font-weight:700}
h2{font-size:1.2rem;font-weight:600}
.eyebrow{font-family:var(--f-display);font-size:.8rem;color:var(--accent);font-weight:600;letter-spacing:.02em}
.muted{color:var(--muted);font-size:.9rem}
header.top{display:flex;flex-direction:column;gap:4px;padding-block:8px 4px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:.9rem;color:var(--muted);padding:8px 6px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.list{display:flex;flex-direction:column;gap:10px}
.course{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:right;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,transform .15s}
.course:hover{border-color:var(--accent)}
.course:active{transform:scale(.99)}
.course .code{font-family:var(--f-display);font-size:.78rem;color:var(--accent);font-weight:600;direction:ltr;text-align:right}
.course .name{font-family:var(--f-display);font-weight:600;font-size:1.02rem;grid-column:1}
.course .meta{grid-column:1;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.course .go{grid-row:1/4;grid-column:2;width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:1.2rem}
.course.all{background:var(--accent);border-color:var(--accent);color:#fff}
.course.all .code,.course.all .meta{color:rgba(255,255,255,.85)}
.course.all .go{background:rgba(255,255,255,.18);color:#fff}
.best{display:inline-block;margin-inline-start:6px;padding:0 8px;border-radius:99px;background:var(--good-soft);color:var(--good);font-size:.75rem;font-weight:600}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.link{border:0;background:none;color:var(--accent);font:inherit;font-size:.9rem;cursor:pointer;padding:4px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 18px;display:flex;flex-direction:column;gap:16px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.75rem;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.src-sim{background:var(--warn-soft);color:var(--warn)}
.qtext{font-size:1.12rem;font-weight:500;line-height:1.85}
.qtext u{text-decoration-color:var(--accent);text-underline-offset:5px;text-decoration-thickness:2px}
.opts{display:flex;flex-direction:column;gap:8px}
.tfopts{flex-direction:row}
.tfopts .opt{flex:1;justify-content:center;font-weight:600}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer;line-height:1.6}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,.course:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt .box{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .box{background:var(--accent);border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.feedback{border-radius:12px;padding:12px 14px;font-size:.95rem}
.feedback.ok{background:var(--good-soft);color:var(--good)}
.feedback.no{background:var(--bad-soft);color:var(--bad)}
.feedback b{font-family:var(--f-display)}
.feedback p{margin:4px 0 0;color:var(--ink)}
.feedback .ref{font-size:.8rem;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:13px 18px;font:inherit;font-family:var(--f-display);font-weight:600;font-size:1rem;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:var(--surface);color:var(--accent);border:1.5px solid var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1;min-width:140px}
.score{display:flex;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums}
.score .big{font-family:var(--f-display);font-size:3rem;font-weight:700;color:var(--accent);line-height:1}
.review{display:flex;flex-direction:column;gap:10px}
.rv{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--bad);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:.93rem}
.rv .a{color:var(--good);font-weight:600}
.rv .y{color:var(--bad)}
footer{text-align:center;font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script>

// type: tf (answer true/false) | mc (answer index) | multi (answer array)  ·  src: q = من الكويز، s = محاكي
const COURSES={
 HMD611:"التخطيط في المرافق الصحية",
 HMD612:"التنظيم في المرافق الصحية",
 HMD613:"القيادة الاستراتيجية في المؤسسات الصحية",
 HMD614:"إدارة الموارد البشرية الصحية المتقدمة",
 HMD615:"تحليل وتصميم النظم الصحية"
};
const Q=[
// ===== HMD611 =====
["HMD611","tf","q","تُعد الرؤية والرسالة والأهداف الاستراتيجية الركائز الأساسية لصياغة الاستراتيجية في المرافق الصحية",null,true,"هذه هي الركائز الثلاث التي تُبنى عليها الاستراتيجية."],
["HMD611","tf","q","تحديد الاتجاه المستقبلي للمرفق الصحي <u>ليست</u> من أهمية صياغة الاستراتيجية في المرافق الصحية",null,false,"بل هي أول بند في أهمية صياغة الاستراتيجية."],
["HMD611","tf","q","التخطيط للطوارئ: هو عملية إعداد استراتيجيات وخطط منظمة للتعامل مع الأحداث الطارئة أو الكوارث المفاجئة",null,true,"تعريف صحيح للتخطيط للطوارئ."],
["HMD611","tf","q","نقص الموارد المالية <u>لا يعد</u> من معوقات التخطيط الاستراتيجي في المرافق الصحية",null,false,"نقص الموارد المالية هو أول المعوقات."],
["HMD611","mc","q","هو جزء أساسي من وظائف الإدارة الصحية (التخطيط – التنظيم – التوجيه – الرقابة)، ويُعد المرحلة الأولى التي تُبنى عليها بقية الوظائف:",["التخطيط في المرافق الصحية","التنظيم في المرافق الصحية","الرقابة الصحية","التوجيه الإداري"],0,"التخطيط هو الوظيفة الأولى وتُبنى عليه بقية الوظائف."],
["HMD611","mc","q","من مراحل عملية التخطيط الصحي:",["تحليل الوضع الصحي الحالي (تحليل الفجوة)","تقييم أداء الموظفين السنوي","إعداد سلم الرواتب","تصميم الشعار المؤسسي"],0,"تحليل الوضع الحالي ومقارنته بالمرغوب (تحليل الفجوة) من مراحل التخطيط الصحي."],
["HMD611","mc","q","من التحديات التي تواجه التخطيط الصحي:",["زيادة الطلب على الخدمات الصحية","ثبات عدد السكان","وفرة الكوادر الصحية المتخصصة","انخفاض تكاليف التقنيات الطبية"],0,"زيادة الطلب على الخدمات من أبرز التحديات."],
["HMD611","mc","q","من خطوات ومراحل التخطيط الاستراتيجي:",["خطوة تحديد الأهداف ووضع الافتراضات والتوقعات","خطوة صرف الحوافز السنوية","خطوة اختيار الموردين","خطوة إعداد جدول المناوبات"],0,"تحديد الأهداف ووضع الافتراضات والتوقعات من خطوات التخطيط الاستراتيجي."],
["HMD611","mc","q","هو عملية ترجمة الأهداف الاستراتيجية والسياسات العامة إلى خطط تنفيذية قصيرة المدى:",["التخطيط التشغيلي","التخطيط الاستراتيجي","التخطيط للطوارئ","التخطيط طويل المدى"],0,"التشغيلي يترجم الاستراتيجي إلى خطط تنفيذية قصيرة المدى."],
["HMD611","tf","s","التخطيط التشغيلي يغطي فترة <u>طويلة المدى</u> ويحدد الاتجاه العام للمرفق الصحي",null,false,"هذا وصف التخطيط الاستراتيجي، أما التشغيلي فخطط تنفيذية قصيرة المدى."],
["HMD611","tf","s","يُعد التخطيط المرحلة الأولى من وظائف الإدارة الصحية وتُبنى عليه بقية الوظائف",null,true,"الترتيب: التخطيط ثم التنظيم ثم التوجيه ثم الرقابة."],
["HMD611","tf","s","التخطيط للطوارئ يهتم <u>بالعمليات اليومية الروتينية</u> في المرفق الصحي",null,false,"يهتم بالأحداث الطارئة والكوارث المفاجئة."],
["HMD611","mc","s","أي مما يلي يأتي في مقدمة أهمية صياغة الاستراتيجية في المرافق الصحية؟",["تحديد الاتجاه المستقبلي للمرفق الصحي","زيادة الإجراءات الورقية","تقليل التواصل بين الأقسام","إلغاء دور الرقابة"],0,"تحديد الاتجاه المستقبلي هو أول بند في الأهمية."],
["HMD611","mc","s","يأتي في مقدمة معوقات التخطيط الاستراتيجي في المرافق الصحية:",["نقص الموارد المالية","وضوح الرؤية والرسالة","دعم الإدارة العليا","توفر البيانات الصحية"],0,"نقص الموارد المالية هو أول المعوقات، والخيارات الأخرى عوامل نجاح."],
["HMD611","tf","s","تحليل الفجوة يقارن بين الوضع الصحي الحالي والوضع المرغوب الوصول إليه",null,true,"وهو من مراحل عملية التخطيط الصحي."],
["HMD611","multi","s","من الركائز الأساسية لصياغة الاستراتيجية في المرافق الصحية: (اختر أكثر من إجابة)",["الرؤية","الرسالة","الأهداف الاستراتيجية","جدول المناوبات"],[0,1,2],"الركائز الثلاث: الرؤية والرسالة والأهداف الاستراتيجية."],
["HMD611","tf","s","زيادة الطلب على الخدمات الصحية <u>ليست</u> من تحديات التخطيط الصحي",null,false,"هي من أبرز تحديات التخطيط الصحي."],

// ===== HMD612 =====
["HMD612","multi","q","أي من الخصائص التالية تشير إلى الهيكل التنظيمي <b>المخصص</b>؟ (اختر أكثر من إجابة)",["تشكيل فريق من المتخصصين ذوي الخلفيات المتنوعة","انخفاض في ولاء الموظفين للمنظمة الأم","التزام صارم بوحدة الأمر","كثرة المستويات الهرمية"],[0,1],"المخصص يقوم على فرق متخصصة متنوعة، ومن آثاره انخفاض الولاء للمنظمة الأم."],

["HMD612","tf","q","الهيكل التنظيمي الهرمي هو الهيكل التسلسلي",null,true,"المسميان لهيكل واحد."],
["HMD612","tf","q","الهيكل التنظيمي الهرمي مناسب للمؤسسات <u>الكبيرة</u>",null,false,"مناسب للمؤسسات الصغيرة."],
["HMD612","multi","q","أي من العبارات الآتية من خصائص <b>الهيكل المصفوفي</b>؟ (اختر أكثر من إجابة)",["يعمل الموظف بوضوح تحت إشراف مديرين أو أكثر","يتميز بمستويات هرمية أقل وقواعد أقل رسمية","يخضع الموظف لمدير واحد فقط","تأتي الأوامر من أعلى الهرم إلى أسفله فقط"],[0,1],"الخياران الأخيران من خصائص الهيكل الهرمي."],
["HMD612","multi","q","أي مما يلي من خصائص <b>الهيكل التنظيمي الوظيفي</b>؟ (اختر أكثر من إجابة)",["احتمالية نشوب نزاعات نتيجة لمبدأ وحدة القيادة","لا يقتصر دور الاستشاريين على تقديم المشورة فقط","ليس للاستشاريين أي سلطة","لا يوجد فيه أي تخصص في الأعمال"],[0,1],"في الوظيفي للاستشاريين سلطة قيادية في مهام محددة، وقد تنشأ نزاعات بسبب ذلك."],
["HMD612","multi","q","أي مما يلي يصف <b>المخطط التنظيمي الوظيفي</b>؟ (اختر أكثر من إجابة)",["يعكس وظائف ومهام مكونات المنظمة","يشير إلى العلاقات المتبادلة بين الوظائف","يعرض أسماء شاغلي الوظائف فقط","يوضح رواتب الموظفين"],[0,1],"المخطط الوظيفي يركز على الوظائف والعلاقات بينها."],
["HMD612","tf","q","في الهيكل التنظيمي <u>الهرمي</u> يعمل الموظف بوضوح تحت إشراف مديرين أو أكثر",null,false,"هذا من خصائص الهيكل المصفوفي."],
["HMD612","tf","q","في الهيكل التنظيمي الهرمي تأتي الموافقات والأوامر من أعلى الهرم إلى أسفله",null,true,"هذه السمة الأساسية للهيكل الهرمي."],
["HMD612","tf","q","في الهيكل التنظيمي الوظيفي <u>يقتصر</u> دور الاستشاريين على تقديم المشورة فقط",null,false,"لهم سلطة قيادية في مهام محددة."],
["HMD612","tf","s","في الهيكل المصفوفي قد يعمل الموظف تحت إشراف أكثر من مدير في الوقت نفسه",null,true,"هذه أبرز سمات الهيكل المصفوفي."],
["HMD612","tf","s","من خصائص الهيكل المخصص <u>زيادة</u> ولاء الموظفين للمنظمة الأم",null,false,"العكس: ينخفض ولاء الموظفين للمنظمة الأم."],
["HMD612","tf","s","من مآخذ المخطط التنظيمي أنه <u>يُظهر جميع العلاقات غير الرسمية</u> بدقة",null,false,"المأخذ أنه يهمل العديد من العلاقات غير الرسمية."],
["HMD612","mc","s","الهيكل الذي تأتي فيه الموافقات والأوامر من أعلى الهرم إلى أسفله:",["الهيكل الهرمي","الهيكل المصفوفي","الهيكل المخصص","الهيكل الوظيفي"],0,"الهرمي (التسلسلي) تتدفق فيه الأوامر من الأعلى للأسفل."],
["HMD612","mc","s","الهيكل الذي يتميز بمستويات هرمية أقل وقواعد أقل رسمية:",["الهيكل المصفوفي","الهيكل الهرمي","الهيكل التسلسلي","الهيكل الوظيفي"],0,"المصفوفي أقل رسمية وأقل في المستويات."],
["HMD612","mc","s","الهيكل الذي يقوم على تشكيل فريق من المتخصصين ذوي الخلفيات المتنوعة:",["الهيكل المخصص","الهيكل الهرمي","الهيكل التسلسلي","الهيكل الوظيفي"],0,"هذه السمة الأساسية للهيكل المخصص."],
["HMD612","tf","s","الهيكل التنظيمي الهرمي مناسب للمؤسسات الصغيرة",null,true,"صحيح، وليس للكبيرة."],
["HMD612","mc","s","أي مما يلي <u>ليس</u> من المآخذ على المخطط التنظيمي؟",["يوضح خطوط السلطة والمسؤولية","يهمل العديد من العلاقات غير الرسمية","يصبح قديمًا بسرعة كبيرة","لا يعكس الواقع الفعلي للعلاقات"],0,"توضيح خطوط السلطة ميزة للمخطط وليس مأخذًا عليه."],

// ===== HMD613 =====
["HMD613","tf","q","تركز القيادة الاستراتيجية على التوجه المستقبلي واتخاذ القرارات طويلة المدى",null,true,"وهذا ما يميزها عن القيادة الإدارية."],

Q.push(...LQ);

const KEY="hmd-quiz-best-v1";
let best={};try{best=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
function saveBest(){try{localStorage.setItem(KEY,JSON.stringify(best))}catch(e){}}

const app=document.getElementById("app");
let mode="all"; // all | q | s
let S=null;

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pool=code=>Q.filter(x=>(code==="ALL"||x[0]===code)&&(mode==="all"||x[2]===mode));
const typeLabel={tf:"صح أو خطأ",mc:"اختيار من متعدد",multi:"أكثر من إجابة"};

function home(){
  S=null;
  const modes=[["all","الكل"],["q","أسئلة الكويز"],["s","أسئلة محاكية"]];
  let h=`<header class="top"><span class="eyebrow">الدبلوم العالي في الإدارة الصحية</span><h1>اختبارات الإدارة الصحية</h1><span class="muted">أسئلة الكويزات، وأسئلة محاكية مبنية على المحاضرات، مع تصحيح فوري وشرح ومرجع كل سؤال.</span></header>`;
  h+=`<div class="seg" role="group" aria-label="نوع الأسئلة">${modes.map(m=>`<button id="m-${m[0]}" aria-pressed="${mode===m[0]}" data-mode="${m[0]}">${m[1]}</button>`).join("")}</div>`;
  h+=`<div class="list">`;
  const all=pool("ALL").length;
  h+=card("ALL","جميع المواد","اختبار شامل",all,true);
  for(const c in COURSES)h+=card(c,COURSES[c],c,pool(c).length,false);
  h+=`</div><footer>ملخص راشد العتيبي · ${Q.length} سؤالًا</footer>`;
  app.innerHTML=h;
  app.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;home()});
  app.querySelectorAll("[data-course]").forEach(b=>b.onclick=()=>start(b.dataset.course));
}
function card(code,name,label,n,all){
  const b=best[code+"|"+mode];
  return `<button class="course${all?" all":""}" data-course="${code}" ${n?"":"disabled"}>
    <span class="code">${label}</span><span class="name">${name}</span>
    <span class="meta">${n} سؤالًا${b!=null?`<span class="best">أفضل نتيجة ${b}%</span>`:""}</span>
    <span class="go" aria-hidden="true">‹</span></button>`;
}

function start(code,list){
  const qs=list||shuffle(pool(code));
  S={code,qs:qs.map(q=>({q,order:q[1]==="tf"?[0,1]:shuffle(q[4].map((_,i)=>i))})),i:0,sel:[],done:false,res:[]};
  render();
}
function isRight(item,picked){
  const q=item.q;
  if(q[1]==="tf")return (picked[0]===0)===q[5];
  if(q[1]==="mc")return picked[0]===q[5];
  const a=[...q[5]].sort(),p=[...picked].sort();return a.length===p.length&&a.every((v,i)=>v===p[i]);
}
function correctSet(q){return q[1]==="tf"?[q[5]?0:1]:q[1]==="mc"?[q[5]]:q[5]}
function optText(q,i){return q[1]==="tf"?(i===0?"صح ✓":"خطأ ✗"):q[4][i]}

function render(){
  const it=S.qs[S.i],q=it.q,n=S.qs.length;
  const right=S.done&&isRight(it,S.sel), cs=correctSet(q);
  let h=`<div class="qhead"><button class="link" id="quit">‹ المواد</button><span>${S.i+1} / ${n}</span></div>
  <div class="bar"><i style="width:${(S.i+(S.done?1:0))/n*100}%"></i></div>
  <article class="card"><div class="tags"><span class="tag">${q[0]}</span><span class="tag">${typeLabel[q[1]]}</span><span class="tag ${q[2]==="s"?"src-sim":""}">${q[2]==="q"?"من الكويز":"محاكي"}</span></div>
  <div class="qtext">${q[3]}</div>
  <div class="opts ${q[1]==="tf"?"tfopts":""}">`;
  it.order.forEach(i=>{
    let cls="opt";
    if(S.done){if(cs.includes(i))cls+=" right";else if(S.sel.includes(i))cls+=" wrong"}
    else if(S.sel.includes(i))cls+=" sel";
    h+=`<button class="${cls}" data-o="${i}" ${S.done?"disabled":""}>${q[1]==="multi"?'<span class="box"></span>':""}<span>${optText(q,i)}</span></button>`;
  });
  h+=`</div>`;
  if(S.done)h+=`<div class="feedback ${right?"ok":"no"}"><b>${right?"إجابة صحيحة":"إجابة خاطئة"}</b><p>${q[6]}</p>${q[7]?`<p class="ref">المرجع: ${q[7]}</p>`:""}</div>`;
  h+=`</article><div class="actions">`;
  if(!S.done&&q[1]==="multi")h+=`<button class="btn" id="check" ${S.sel.length?"":"disabled"}>تحقق من الإجابة</button>`;
  if(S.done)h+=`<button class="btn" id="next">${S.i+1<n?"السؤال التالي":"عرض النتيجة"}</button>`;
  h+=`</div>`;
  app.innerHTML=h;
  document.getElementById("quit").onclick=home;
  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
    const o=+b.dataset.o;
    if(q[1]==="multi"){S.sel=S.sel.includes(o)?S.sel.filter(x=>x!==o):[...S.sel,o];render()}
    else{S.sel=[o];answer()}
  });
  const c=document.getElementById("check");if(c)c.onclick=answer;
  const nx=document.getElementById("next");if(nx){nx.onclick=()=>{S.i++;S.sel=[];S.done=false;S.i<n?render():result()};nx.focus()}
}
function answer(){S.done=true;S.res.push({it:S.qs[S.i],sel:S.sel.slice(),ok:isRight(S.qs[S.i],S.sel)});render()}

function result(){
  const n=S.res.length,ok=S.res.filter(r=>r.ok).length,pct=Math.round(ok/n*100);
  const k=S.code+"|"+mode;if(best[k]==null||pct>best[k]){best[k]=pct;saveBest()}
  const wrong=S.res.filter(r=>!r.ok);
  const title=S.code==="ALL"?"جميع المواد":COURSES[S.code];
  let h=`<header class="top"><span class="eyebrow">${S.code==="ALL"?"اختبار شامل":S.code}</span><h2>${title}</h2></header>
  <div class="card"><div class="score"><span class="big">${pct}%</span><span class="muted">${ok} من ${n} إجابة صحيحة</span></div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <div class="actions">${wrong.length?`<button class="btn" id="retryWrong">أعد الأسئلة الخاطئة (${wrong.length})</button>`:""}<button class="btn ghost" id="again">اختبار جديد</button><button class="btn ghost" id="back">المواد</button></div></div>`;
  if(wrong.length){
    h+=`<h2>مراجعة الأخطاء</h2><div class="review">`;
    for(const r of wrong){const q=r.it.q;
      h+=`<div class="rv"><span class="muted">${q[0]} · ${typeLabel[q[1]]}</span><div>${q[3]}</div>
      <div class="y">إجابتك: ${r.sel.map(i=>optText(q,i)).join(" + ")}</div>
      <div class="a">الصحيح: ${correctSet(q).map(i=>optText(q,i)).join(" + ")}</div>
      <div class="muted">${q[6]}${q[7]?` · ${q[7]}`:""}</div></div>`}
    h+=`</div>`;
  } else h+=`<p class="muted">ما عندك ولا خطأ. ممتاز.</p>`;
  app.innerHTML=h;
  const code=S.code;
  const rw=document.getElementById("retryWrong");if(rw)rw.onclick=()=>start(code,shuffle(wrong.map(r=>r.it.q)));
  document.getElementById("again").onclick=()=>start(code);
  document.getElementById("back").onclick=home;
  window.scrollTo(0,0);
